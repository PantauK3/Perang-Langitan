<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PERANG LANGITAN - Arcade Shooter</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: #071326;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 480px;
    max-height: 860px;
    box-shadow: 0 0 30px rgba(0, 160, 255, 0.35);
    background: #0b5ed7;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="360" height="640"></canvas>
</div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const W = 360;
  const H = 640;

  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;

  // --- MEMUAT GAMBAR MENU & SPRITE SHEET ---
  const menuImg = new Image();
  let menuImgLoaded = false;
  menuImg.onload = () => { menuImgLoaded = true; };
  menuImg.src = 'menu.png';

  const rawSpriteImg = new Image();
  let spriteSheet = null; // Canvas transparan hasil pembersihan latar putih

  rawSpriteImg.onload = () => {
    // Otomatis hapus latar putih dari pinggir gambar agar detail putih di dalam pesawat tetap utuh
    const off = document.createElement('canvas');
    off.width = rawSpriteImg.width;
    off.height = rawSpriteImg.height;
    const octx = off.getContext('2d');
    octx.drawImage(rawSpriteImg, 0, 0);

    const imgData = octx.getImageData(0, 0, off.width, off.height);
    const d = imgData.data;
    const w = off.width;
    const h = off.height;
    const visited = new Uint8Array(w * h);
    const stack = [0, w - 1, (h - 1) * w, h * w - 1];

    while (stack.length > 0) {
      const idx = stack.pop();
      if (idx < 0 || idx >= w * h || visited[idx]) continue;
      visited[idx] = 1;
      const p = idx * 4;
      if (d[p] > 235 && d[p + 1] > 235 && d[p + 2] > 235) {
        d[p + 3] = 0; // Jadikan transparan
        const x = idx % w;
        const y = (idx - x) / w;
        if (x > 0) stack.push(idx - 1);
        if (x < w - 1) stack.push(idx + 1);
        if (y > 0) stack.push(idx - w);
        if (y < h - 1) stack.push(idx + w);
      }
    }
    octx.putImageData(imgData, 0, 0);
    spriteSheet = off;
  };
  rawSpriteImg.src = 'sprites.png';

  // Koordinat potongan (persentase lebar & tinggi gambar sprites.png)
  const SPRITES = {
    player:   { x: 0.015, y: 0.008, w: 0.355, h: 0.315 },
    enGreen:  { x: 0.375, y: 0.015, w: 0.130, h: 0.105 },
    enYellow: { x: 0.510, y: 0.015, w: 0.115, h: 0.105 },
    enStealth:{ x: 0.625, y: 0.015, w: 0.105, h: 0.105 },
    enBat:    { x: 0.545, y: 0.345, w: 0.155, h: 0.095 },
    enUfo:    { x: 0.840, y: 0.330, w: 0.155, h: 0.115 },
    boss:     { x: 0.728, y: 0.015, w: 0.265, h: 0.310 },
    boltBlue: { x: 0.045, y: 0.455, w: 0.032, h: 0.065 },
    boltRed:  { x: 0.048, y: 0.530, w: 0.032, h: 0.065 },
    missile:  { x: 0.678, y: 0.450, w: 0.042, h: 0.110 },
    powS:     { x: 0.445, y: 0.640, w: 0.070, h: 0.075 },
    powH:     { x: 0.515, y: 0.640, w: 0.072, h: 0.075 },
    powB:     { x: 0.592, y: 0.640, w: 0.068, h: 0.072 },
    powP:     { x: 0.685, y: 0.640, w: 0.068, h: 0.072 },
    exp0:     { x: 0.008, y: 0.720, w: 0.105, h: 0.105 },
    exp1:     { x: 0.115, y: 0.720, w: 0.115, h: 0.105 },
    exp2:     { x: 0.232, y: 0.720, w: 0.115, h: 0.105 },
    exp3:     { x: 0.348, y: 0.720, w: 0.110, h: 0.105 },
    exp4:     { x: 0.460, y: 0.720, w: 0.125, h: 0.115 }
  };

  function drawSprite(key, x, y, drawW, drawH, flipVertical = false) {
    if (!spriteSheet) return false;
    const s = SPRITES[key];
    if (!s) return false;
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    if (flipVertical) ctx.rotate(Math.PI);
    ctx.drawImage(
      spriteSheet,
      s.x * spriteSheet.width,
      s.y * spriteSheet.height,
      s.w * spriteSheet.width,
      s.h * spriteSheet.height,
      -drawW / 2,
      -drawH / 2,
      drawW,
      drawH
    );
    ctx.restore();
    return true;
  }

  // --- AUDIO RETRO (WEB AUDIO API) ---
  let audioCtx = null;
  let soundEnabled = true;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone(freq, type, duration, vol = 0.12, slideFreq = null) {
    if (!soundEnabled) return;
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function playShoot() { playTone(880, 'square', 0.08, 0.05, 220); }
  function playExplosion() { playTone(140, 'sawtooth', 0.28, 0.14, 35); }
  function playPowerup() {
    playTone(523, 'square', 0.08, 0.1);
    setTimeout(() => playTone(659, 'square', 0.08, 0.1), 70);
    setTimeout(() => playTone(784, 'square', 0.14, 0.1), 140);
  }
  function playClick() { playTone(620, 'square', 0.06, 0.08, 820); }
  function playBomb() { playTone(100, 'sawtooth', 0.6, 0.22, 25); }

  // --- PENYIMPANAN SKOR ---
  let highScore = parseInt(localStorage.getItem('pl_highscore')) || 12340;
  let bestLevel = parseInt(localStorage.getItem('pl_bestlevel')) || 5;
  let difficulty = localStorage.getItem('pl_diff') || 'NORMAL';

  function saveRecords() {
    localStorage.setItem('pl_highscore', highScore);
    localStorage.setItem('pl_bestlevel', bestLevel);
    localStorage.setItem('pl_diff', difficulty);
  }

  // --- STATE GAME ---
  let state = 'MENU';
  let frame = 0;
  let pressedBtn = null;

  // --- VARIABEL GAMEPLAY ---
  let score = 0;
  let level = 1;
  let seaOffset = 0;
  let screenShake = 0;
  let flashAlpha = 0;

  const player = {
    x: W / 2,
    y: H - 100,
    hp: 100,
    maxHp: 100,
    weaponLevel: 1,
    shield: 0,
    bombs: 2,
    fireTimer: 0,
    invuln: 0
  };

  let bullets = [];
  let enemyBullets = [];
  let enemies = [];
  let explosions = [];
  let powerups = [];
  let clouds = [];
  let islands = [];
  let boss = null;
  let enemiesDefeatedInLevel = 0;

  const menuHitboxes = [
    { id: 'START', x: 58, y: 318, w: 244, h: 52 },
    { id: 'SETTINGS', x: 80, y: 374, w: 200, h: 38 },
    { id: 'HIGHSCORE', x: 80, y: 416, w: 200, h: 38 },
    { id: 'ABOUT', x: 80, y: 458, w: 200, h: 38 },
    { id: 'EXIT', x: 80, y: 500, w: 200, h: 38 }
  ];

  // --- INPUT KONTROL ---
  let pointerDown = false;
  let targetX = W / 2;
  let targetY = H - 100;
  let lastTapTime = 0;
  const keys = {};

  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (state === 'PLAYING' && e.code === 'Space') triggerBomb();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  function getCanvasPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((clientX - rect.left) / rect.width) * W,
      y: ((clientY - rect.top) / rect.height) * H
    };
  }

  function handlePointerStart(cx, cy) {
    initAudio();
    const pos = getCanvasPos(cx, cy);
    pointerDown = true;

    if (state === 'MENU') {
      for (const btn of menuHitboxes) {
        if (pos.x >= btn.x && pos.x <= btn.x + btn.w && pos.y >= btn.y && pos.y <= btn.y + btn.h) {
          pressedBtn = btn.id;
          playClick();
          setTimeout(() => {
            pressedBtn = null;
            if (btn.id === 'START') startGame();
            else if (btn.id === 'SETTINGS') state = 'SETTINGS';
            else if (btn.id === 'HIGHSCORE') state = 'HIGHSCORE';
            else if (btn.id === 'ABOUT') state = 'ABOUT';
            else if (btn.id === 'EXIT') alert('Terima kasih telah bermain PERANG LANGITAN!');
          }, 110);
          return;
        }
      }
    } else if (state === 'SETTINGS') {
      if (pos.x >= 65 && pos.x <= W - 65 && pos.y >= 240 && pos.y <= 284) {
        soundEnabled = !soundEnabled;
        playClick();
      }
      if (pos.x >= 65 && pos.x <= W - 65 && pos.y >= 300 && pos.y <= 344) {
        const diffs = ['MUDAH', 'NORMAL', 'SULIT'];
        difficulty = diffs[(diffs.indexOf(difficulty) + 1) % diffs.length];
        saveRecords();
        playClick();
      }
      if (pos.x >= 85 && pos.x <= W - 85 && pos.y >= 460 && pos.y <= 504) {
        playClick();
        state = 'MENU';
      }
    } else if (state === 'HIGHSCORE' || state === 'ABOUT') {
      if (pos.x >= 85 && pos.x <= W - 85 && pos.y >= 460 && pos.y <= 504) {
        playClick();
        state = 'MENU';
      }
    } else if (state === 'GAMEOVER') {
      if (pos.x >= 70 && pos.x <= W - 70 && pos.y >= 380 && pos.y <= 426) {
        playClick();
        startGame();
      } else if (pos.x >= 85 && pos.x <= W - 85 && pos.y >= 440 && pos.y <= 482) {
        playClick();
        state = 'MENU';
      }
    } else if (state === 'PLAYING') {
      if (pos.x >= W - 64 && pos.y >= H - 64) {
        triggerBomb();
        return;
      }
      const now = Date.now();
      if (now - lastTapTime < 260) triggerBomb();
      lastTapTime = now;
      targetX = pos.x;
      targetY = pos.y - 28;
    }
  }

  function handlePointerMove(cx, cy) {
    if (!pointerDown || state !== 'PLAYING') return;
    const pos = getCanvasPos(cx, cy);
    targetX = pos.x;
    targetY = pos.y - 28;
  }

  canvas.addEventListener('mousedown', e => handlePointerStart(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => handlePointerMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', () => { pointerDown = false; });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (e.touches.length > 0) handlePointerStart(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length > 0) handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  canvas.addEventListener('touchend', () => { pointerDown = false; });

  // --- FUNGSI MULAI GAME ---
  function startGame() {
    score = 0;
    level = 1;
    enemiesDefeatedInLevel = 0;
    player.x = W / 2;
    player.y = H - 100;
    targetX = player.x;
    targetY = player.y;
    player.hp = 100;
    player.weaponLevel = 1;
    player.shield = 0;
    player.bombs = 2;
    player.invuln = 60;
    bullets = [];
    enemyBullets = [];
    enemies = [];
    explosions = [];
    powerups = [];
    boss = null;

    clouds = [];
    for (let i = 0; i < 6; i++) {
      clouds.push({
        x: Math.random() * W,
        y: Math.random() * H,
        w: 50 + Math.random() * 60,
        speed: 0.4 + Math.random() * 0.5
      });
    }

    islands = [
      { x: 48, y: 120, r: 26 },
      { x: 295, y: 390, r: 34 }
    ];

    state = 'PLAYING';
  }

  function triggerBomb() {
    if (player.bombs <= 0 || state !== 'PLAYING') return;
    player.bombs--;
    playBomb();
    screenShake = 18;
    flashAlpha = 0.85;
    enemyBullets = [];
    enemies.forEach(en => {
      en.hp -= 120;
      spawnExplosion(en.x, en.y, 44);
    });
    if (boss) {
      boss.hp -= 180;
      spawnExplosion(boss.x, boss.y, 68);
    }
  }

  function spawnExplosion(x, y, size = 42) {
    explosions.push({ x, y, size, timer: 0, maxTimer: 20 });
  }

  function drawBevelBox(x, y, w, h, bgTop, bgBot, borderCol) {
    const cut = 8;
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x + cut, y);
    ctx.lineTo(x + w - cut, y);
    ctx.lineTo(x + w, y + cut);
    ctx.lineTo(x + w, y + h - cut);
    ctx.lineTo(x + w - cut, y + h);
    ctx.lineTo(x + cut, y + h);
    ctx.lineTo(x, y + h - cut);
    ctx.lineTo(x, y + cut);
    ctx.closePath();

    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, bgTop);
    grad.addColorStop(1, bgBot);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.lineWidth = 2.5;
    ctx.strokeStyle = borderCol;
    ctx.stroke();
    ctx.restore();
  }

  // --- RENDER MENU UTAMA ---
  function renderMenu() {
    if (menuImgLoaded) {
      ctx.drawImage(menuImg, 0, 0, W, H);

      if (highScore !== 12340) {
        ctx.fillStyle = '#0b2249';
        ctx.fillRect(44, 19, 72, 15);
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 13px Courier New';
        ctx.textAlign = 'left';
        ctx.fillText(String(highScore).padStart(6, '0'), 46, 31);
      }
      if (bestLevel !== 5) {
        ctx.fillStyle = '#0b2249';
        ctx.fillRect(262, 19, 52, 16);
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 14px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(String(bestLevel), 288, 32);
      }

      if (pressedBtn) {
        const b = menuHitboxes.find(item => item.id === pressedBtn);
        if (b) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
          ctx.fillRect(b.x, b.y, b.w, b.h);
        }
      }
    } else {
      ctx.fillStyle = '#0b5ed7';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('MEMUAT PERANG LANGITAN...', W / 2, H / 2);
    }
  }

  // --- UPDATE & RENDER GAMEPLAY ---
  function updateGameplay() {
    seaOffset = (seaOffset + 1.8) % 64;

    const speed = 5.2;
    if (keys['ArrowLeft'] || keys['KeyA']) targetX -= speed;
    if (keys['ArrowRight'] || keys['KeyD']) targetX += speed;
    if (keys['ArrowUp'] || keys['KeyW']) targetY -= speed;
    if (keys['ArrowDown'] || keys['KeyS']) targetY += speed;

    targetX = Math.max(28, Math.min(W - 28, targetX));
    targetY = Math.max(50, Math.min(H - 36, targetY));

    player.x += (targetX - player.x) * 0.25;
    player.y += (targetY - player.y) * 0.25;

    if (player.invuln > 0) player.invuln--;
    if (player.shield > 0) player.shield--;

    // Tembak otomatis
    player.fireTimer++;
    if (player.fireTimer >= 9) {
      player.fireTimer = 0;
      playShoot();
      if (player.weaponLevel === 1) {
        bullets.push({ x: player.x, y: player.y - 26, vx: 0, vy: -10, dmg: 12, kind: 'bolt' });
      } else if (player.weaponLevel === 2) {
        bullets.push({ x: player.x - 10, y: player.y - 22, vx: 0, vy: -10, dmg: 11, kind: 'bolt' });
        bullets.push({ x: player.x + 10, y: player.y - 22, vx: 0, vy: -10, dmg: 11, kind: 'bolt' });
      } else {
        bullets.push({ x: player.x, y: player.y - 28, vx: 0, vy: -11, dmg: 14, kind: 'missile' });
        bullets.push({ x: player.x - 14, y: player.y - 16, vx: -1.3, vy: -10, dmg: 10, kind: 'bolt' });
        bullets.push({ x: player.x + 14, y: player.y - 16, vx: 1.3, vy: -10, dmg: 10, kind: 'bolt' });
      }
    }

    // Spawn Musuh atau Bos
    const diffMult = difficulty === 'MUDAH' ? 0.75 : (difficulty === 'SULIT' ? 1.35 : 1);
    if (!boss && enemiesDefeatedInLevel >= 12 + level * 4) {
      boss = {
        x: W / 2,
        y: -70,
        targetY: 105,
        hp: (280 + level * 140) * diffMult,
        maxHp: (280 + level * 140) * diffMult,
        dir: 1,
        shootTimer: 0
      };
    } else if (!boss && frame % Math.max(24, Math.floor(54 - level * 3)) === 0) {
      const pool = ['enGreen', 'enYellow', 'enStealth', 'enBat', 'enUfo'];
      const kind = pool[Math.floor(Math.random() * pool.length)];
      const isHeavy = kind === 'enStealth' || kind === 'enUfo';
      enemies.push({
        x: 32 + Math.random() * (W - 64),
        y: -35,
        kind,
        isHeavy,
        hp: (isHeavy ? 42 : 20) * diffMult,
        vy: isHeavy ? 1.7 : 2.5 + Math.random() * 1.1,
        vx: (Math.random() - 0.5) * 1.5,
        shootTimer: Math.floor(Math.random() * 50)
      });
    }

    bullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
    bullets = bullets.filter(b => b.y > -25 && b.x > -20 && b.x < W + 20);

    enemies.forEach(en => {
      en.x += en.vx;
      en.y += en.vy;
      if (en.x < 26 || en.x > W - 26) en.vx *= -1;
      en.shootTimer++;
      if (en.shootTimer >= Math.max(45, 95 - level * 5)) {
        en.shootTimer = 0;
        const ang = Math.atan2(player.y - en.y, player.x - en.x);
        const spd = 3.2 * diffMult;
        enemyBullets.push({ x: en.x, y: en.y + 14, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd });
      }
    });

    if (boss) {
      if (boss.y < boss.targetY) boss.y += 1.5;
      else {
        boss.x += boss.dir * (1.4 + level * 0.15);
        if (boss.x < 70 || boss.x > W - 70) boss.dir *= -1;
      }
      boss.shootTimer++;
      if (boss.shootTimer % 38 === 0) {
        for (let a = -2; a <= 2; a++) {
          enemyBullets.push({
            x: boss.x + a * 16,
            y: boss.y + 32,
            vx: a * 0.85,
            vy: 3.4 * diffMult
          });
        }
      }
    }

    enemyBullets.forEach(eb => { eb.x += eb.vx; eb.y += eb.vy; });
    enemyBullets = enemyBullets.filter(eb => eb.y < H + 20 && eb.y > -20 && eb.x > -20 && eb.x < W + 20);

    bullets.forEach(b => {
      enemies.forEach(en => {
        if (Math.abs(b.x - en.x) < 22 && Math.abs(b.y - en.y) < 22) {
          en.hp -= b.dmg;
          b.y = -999;
          spawnExplosion(b.x, b.y, 18);
        }
      });
      if (boss && Math.abs(b.x - boss.x) < 52 && Math.abs(b.y - boss.y) < 42) {
        boss.hp -= b.dmg;
        b.y = -999;
        spawnExplosion(b.x, b.y, 22);
      }
    });

    enemies = enemies.filter(en => {
      if (en.hp <= 0) {
        playExplosion();
        spawnExplosion(en.x, en.y, en.isHeavy ? 52 : 38);
        score += en.isHeavy ? 300 : 120;
        enemiesDefeatedInLevel++;
        if (Math.random() < 0.24) {
          const types = ['P', 'S', 'H', 'B'];
          powerups.push({
            x: en.x,
            y: en.y,
            type: types[Math.floor(Math.random() * types.length)]
          });
        }
        return false;
      }
      return en.y < H + 45;
    });

    if (boss && boss.hp <= 0) {
      playBomb();
      screenShake = 22;
      spawnExplosion(boss.x, boss.y, 110);
      score += 1500 * level;
      boss = null;
      level++;
      enemiesDefeatedInLevel = 0;
      if (level > bestLevel) bestLevel = level;
      if (score > highScore) highScore = score;
      saveRecords();
    }

    powerups.forEach(p => { p.y += 2; });
    powerups = powerups.filter(p => {
      if (Math.abs(p.x - player.x) < 28 && Math.abs(p.y - player.y) < 28) {
        playPowerup();
        score += 150;
        if (p.type === 'P') player.weaponLevel = Math.min(3, player.weaponLevel + 1);
        else if (p.type === 'S') player.shield = 360;
        else if (p.type === 'H') player.hp = Math.min(player.maxHp, player.hp + 35);
        else if (p.type === 'B') player.bombs = Math.min(5, player.bombs + 1);
        return false;
      }
      return p.y < H + 20;
    });

    if (player.invuln <= 0 && player.shield <= 0) {
      enemyBullets.forEach(eb => {
        if (Math.abs(eb.x - player.x) < 13 && Math.abs(eb.y - player.y) < 15) {
          eb.y = H + 999;
          damagePlayer(20);
        }
      });
      enemies.forEach(en => {
        if (Math.abs(en.x - player.x) < 24 && Math.abs(en.y - player.y) < 24) {
          en.hp = 0;
          damagePlayer(30);
        }
      });
    }

    clouds.forEach(c => {
      c.y += c.speed;
      if (c.y > H + 40) { c.y = -40; c.x = Math.random() * W; }
    });
    islands.forEach(isl => {
      isl.y += 1.2;
      if (isl.y > H + 60) { isl.y = -60; isl.x = 30 + Math.random() * (W - 60); }
    });
    explosions.forEach(ex => { ex.timer++; });
    explosions = explosions.filter(ex => ex.timer < ex.maxTimer);

    if (score > highScore) highScore = score;
    if (screenShake > 0) screenShake--;
    if (flashAlpha > 0) flashAlpha -= 0.05;
  }

  function damagePlayer(dmg) {
    player.hp -= dmg;
    player.invuln = 45;
    screenShake = 12;
    playExplosion();
    spawnExplosion(player.x, player.y, 48);
    if (player.hp <= 0) {
      player.hp = 0;
      saveRecords();
      state = 'GAMEOVER';
    }
  }

  function renderGameplay() {
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;

    if (screenShake > 0) {
      ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
    }

    // Lautan
    ctx.fillStyle = '#0284c7';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#0369a1';
    for (let y = -64; y < H + 64; y += 64) {
      for (let x = 0; x < W; x += 64) {
        ctx.fillRect(x + ((y / 64) % 2) * 16, y + seaOffset, 24, 4);
      }
    }

    // Pulau
    islands.forEach(isl => {
      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.arc(isl.x, isl.y, isl.r + 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#15803d';
      ctx.beginPath();
      ctx.arc(isl.x, isl.y, isl.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // Peluru & Rudal Pemain
    bullets.forEach(b => {
      const drawn = b.kind === 'missile'
        ? drawSprite('missile', b.x, b.y, 12, 26, false)
        : drawSprite('boltBlue', b.x, b.y, 10, 20, false);
      if (!drawn) {
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
      }
    });

    // Pesawat Pemain (dari sprites.png)
    if (player.invuln % 6 < 4) {
      const drawn = drawSprite('player', player.x, player.y, 64, 68, false);
      if (!drawn) {
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(player.x - 12, player.y - 16, 24, 32);
      }
      if (player.shield > 0) {
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.85)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(player.x, player.y, 36 + Math.sin(frame * 0.2) * 2, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // Musuh (dari sprites.png, diputar menghadap ke bawah)
    enemies.forEach(en => {
      const sz = en.isHeavy ? 48 : 38;
      const flip = en.kind !== 'enUfo';
      const drawn = drawSprite(en.kind, en.x, en.y, sz, sz, flip);
      if (!drawn) {
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(en.x - 14, en.y - 14, 28, 28);
      }
    });

    // Bos Kapal Induk Raksasa (dari sprites.png)
    if (boss) {
      const drawn = drawSprite('boss', boss.x, boss.y, 118, 128, true);
      if (!drawn) {
        ctx.fillStyle = '#334155';
        ctx.fillRect(boss.x - 50, boss.y - 30, 100, 60);
      }
      // Bar HP Bos
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(boss.x - 50, boss.y - 68, 100, 8);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(boss.x - 49, boss.y - 67, 98 * Math.max(0, boss.hp / boss.maxHp), 6);
    }

    // Peluru Musuh
    enemyBullets.forEach(eb => {
      const drawn = drawSprite('boltRed', eb.x, eb.y, 10, 18, true);
      if (!drawn) {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    // Power-ups (dari sprites.png)
    powerups.forEach(p => {
      const mapKey = { P: 'powP', S: 'powS', H: 'powH', B: 'powB' };
      const drawn = drawSprite(mapKey[p.type], p.x, p.y, 26, 26, false);
      if (!drawn) {
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    // Awan tipis di atas
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    clouds.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.w * 0.4, 0, Math.PI * 2);
      ctx.fill();
    });

    // Animasi Ledakan 5 Frame (dari sprites.png)
    explosions.forEach(ex => {
      const step = Math.min(4, Math.floor((ex.timer / ex.maxTimer) * 5));
      const drawn = drawSprite(`exp${step}`, ex.x, ex.y, ex.size, ex.size, false);
      if (!drawn) {
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(ex.x, ex.y, ex.size * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    if (flashAlpha > 0) {
      ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
      ctx.fillRect(0, 0, W, H);
    }

    // HUD Gameplay
    ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
    ctx.fillRect(0, 0, W, 38);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText(`SKOR: ${String(score).padStart(6, '0')}`, 10, 16);
    ctx.fillStyle = '#facc15';
    ctx.fillText(`LEVEL ${level}`, 10, 31);

    ctx.fillStyle = '#334155';
    ctx.fillRect(W - 120, 10, 110, 12);
    ctx.fillStyle = player.hp > 35 ? '#22c55e' : '#ef4444';
    ctx.fillRect(W - 118, 12, 106 * (player.hp / player.maxHp), 8);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 10px Courier New';
    ctx.textAlign = 'right';
    ctx.fillText(`SENJATA LV.${player.weaponLevel}`, W - 10, 33);

    // Tombol Bom
    drawBevelBox(W - 58, H - 54, 48, 44, '#ef4444', '#7f1d1d', '#fca5a5');
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('BOM', W - 34, H - 35);
    ctx.fillStyle = '#facc15';
    ctx.font = 'bold 13px Courier New';
    ctx.fillText(`x${player.bombs}`, W - 34, H - 19);

    ctx.restore();
  }

  // --- RENDER SUB-MENU & GAME OVER ---
  function renderOverlayBox(title, lines, isGameOver = false) {
    renderMenu();
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;

    ctx.fillStyle = 'rgba(7, 19, 38, 0.84)';
    ctx.fillRect(0, 0, W, H);

    drawBevelBox(28, 140, W - 56, 370, '#1e3a8a', '#0f172a', '#38bdf8');
    ctx.textAlign = 'center';
    ctx.font = '900 26px Impact, Arial Black, sans-serif';
    ctx.fillStyle = '#facc15';
    ctx.fillText(title, W / 2, 188);

    ctx.font = 'bold 14px Courier New';
    ctx.fillStyle = '#e2e8f0';
    lines.forEach((line, idx) => {
      ctx.fillText(line, W / 2, 232 + idx * 28);
    });

    if (state === 'SETTINGS') {
      drawBevelBox(70, 240, W - 140, 44, '#2563eb', '#1e3a8a', '#60a5fa');
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px Courier New';
      ctx.fillText(`SUARA: ${soundEnabled ? 'AKTIF' : 'MATI'}`, W / 2, 267);

      drawBevelBox(70, 300, W - 140, 44, '#2563eb', '#1e3a8a', '#60a5fa');
      ctx.fillText(`TINGKAT: ${difficulty}`, W / 2, 327);
    }

    if (isGameOver) {
      drawBevelBox(75, 380, W - 150, 46, '#fde047', '#d97706', '#ffffff');
      ctx.fillStyle = '#0f172a';
      ctx.font = '900 18px Impact, Arial Black, sans-serif';
      ctx.fillText('MAIN LAGI', W / 2, 410);

      drawBevelBox(90, 440, W - 180, 42, '#ef4444', '#991b1b', '#fca5a5');
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px Impact, Arial Black, sans-serif';
      ctx.fillText('MENU UTAMA', W / 2, 467);
    } else {
      drawBevelBox(90, 460, W - 180, 44, '#ef4444', '#991b1b', '#fca5a5');
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px Impact, Arial Black, sans-serif';
      ctx.fillText('KEMBALI', W / 2, 488);
    }
    ctx.restore();
  }

  // --- LOOP UTAMA ---
  function loop() {
    frame++;
    if (state === 'MENU') renderMenu();
    else if (state === 'PLAYING') {
      updateGameplay();
      renderGameplay();
    } else if (state === 'SETTINGS') {
      renderOverlayBox('PENGATURAN', ['', '', '', '', 'Ketuk tombol untuk ubah']);
    } else if (state === 'HIGHSCORE') {
      renderOverlayBox('PAPAN SKOR', [
        `SKOR TERTINGGI : ${String(highScore).padStart(6, '0')}`,
        `LEVEL TERBAIK  : LEVEL ${bestLevel}`,
        `MODE SULIT     : ${difficulty}`,
        '',
        'Kalahkan bos untuk rekor baru!'
      ]);
    } else if (state === 'ABOUT') {
      renderOverlayBox('TENTANG GAME', [
        'PERANG LANGITAN v1.2',
        'Arcade Air Combat Klasik',
        '',
        'Geser layar / Panah: Gerak',
        'Tombol BOM / Spasi: Ledakan',
        'P: Senjata | S: Perisai | H: HP'
      ]);
    } else if (state === 'GAMEOVER') {
      renderOverlayBox('MISI GAGAL', [
        `SKOR AKHIR : ${String(score).padStart(6, '0')}`,
        `REKOR SKOR : ${String(highScore).padStart(6, '0')}`,
        `LEVEL DICAPAI : ${level}`
      ], true);
    }
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>
